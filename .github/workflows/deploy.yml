name: Build and deploy IBONDA dashboard

on:
  push:
    branches: [main]
    paths:
      - 'IBONDA-NEW-PROJECT.zip'
      - 'agency-redesign.css'
      - 'dashboard-overrides/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ''

      - name: Extract project archive
        run: |
          mkdir -p extracted
          unzip -q IBONDA-NEW-PROJECT.zip -d extracted
          PROJECT_DIR="$(dirname "$(find extracted -name package.json -print -quit)")"
          if [ -z "$PROJECT_DIR" ]; then
            echo "package.json was not found inside the uploaded ZIP."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using project directory: $PROJECT_DIR"

      - name: Apply seller lead and intent-specific CRM enhancements
        run: node dashboard-overrides/apply-seller-leads.mjs "$PROJECT_DIR"

      - name: Add single owner selection and quick owner creation to properties
        run: node dashboard-overrides/add-single-owner-property-link.mjs "$PROJECT_DIR"

      - name: Keep CRM table column titles clearly visible
        run: node dashboard-overrides/visible-table-headers.mjs "$PROJECT_DIR"

      - name: Apply dashboard KPI additions
        run: node dashboard-overrides/add-intent-kpis.mjs "$PROJECT_DIR"

      - name: Apply dashboard visual refresh
        run: |
          if [ ! -f "$PROJECT_DIR/src/index.css" ]; then
            echo "Dashboard stylesheet was not found."
            exit 1
          fi
          cat agency-redesign.css >> "$PROJECT_DIR/src/index.css"

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install --legacy-peer-deps

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GITHUB_ACTIONS: 'true'
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PROJECT_DIR }}/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
