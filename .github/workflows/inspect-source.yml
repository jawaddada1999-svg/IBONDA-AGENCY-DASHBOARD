name: Inspect source structure
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack and print CRM source excerpts
        shell: bash
        run: |
          mkdir -p extracted
          unzip -q IBONDA-NEW-PROJECT.zip -d extracted
          D=extracted/IBONDA-AGENCY-DASHBOARD/src
          echo '=== LeadsSection: relevant matches ==='
          grep -nE 'AddLead|addLead|leadModal|Modal|intent|transaction_type|newLead|LeadForm|lead form' "$D/components/sections/LeadsSection.tsx" | head -120
          echo '=== LeadsSection: source 1-420 ==='
          sed -n '1,420p' "$D/components/sections/LeadsSection.tsx"
          echo '=== QuickModals relevant lines ==='
          grep -nE 'Lead|lead|intent|transaction_type|buyer|renter|seller|Modal' "$D/components/modals/QuickModals.tsx" | head -140
          echo '=== QuickModals source excerpt ==='
          sed -n '1,460p' "$D/components/modals/QuickModals.tsx"
          echo '=== Lead types ==='
          grep -nE 'interface Lead|type Lead|transaction_type|LeadIntent' "$D/types/domain.ts"
