name: Inspect source structure
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack and inspect relevant source
        shell: bash
        run: |
          mkdir -p extracted
          unzip -q IBONDA-NEW-PROJECT.zip -d extracted
          echo '=== SOURCE FILES ==='
          find extracted -type f | sed 's#extracted/##' | head -150
          echo '=== CRM COMPONENT CANDIDATES ==='
          grep -RIlE 'إضافة عميل محتمل|Add Lead|lead form|CRM|شراء|كراء|بيع' extracted --include='*.tsx' --include='*.jsx' --include='*.ts' --include='*.js' | head -40
          echo '=== TARGETED CONTEXT ==='
          grep -RInE 'إضافة عميل محتمل|Add Lead|lead form|intent|buy|rent|sell' extracted --include='*.tsx' --include='*.jsx' --include='*.ts' --include='*.js' | head -220
